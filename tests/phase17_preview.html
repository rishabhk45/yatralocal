<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YatraLocal - Phase 17 Preview</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <!-- Pinned Leaflet CDN -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvTr5nW+1Z0Cgch9YmsmkepPreBt3znU2zVZ4LVAU9GnST++Rogg" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JTWNTUMq2hXZWZlVVNLTW92qhaoSEUUU46fr" crossorigin=""></script>
  <style>
    body {
      background: var(--color-background, #FAF7F2);
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
  </style>
</head>
<body>
  <div id="preview-root"></div>

  <script type="module">
    import { renderPlaceView } from '../pages/place.js';
    import { showAuthModal } from '../js/auth.js';
    import { store } from '../js/store.js';

    const params = new URLSearchParams(window.location.search);
    const view = params.get('view') || 'place_detail';
    const root = document.getElementById('preview-root');

    async function init() {
      if (view === 'place_detail') {
        const harsilPlace = {
          placeKey: 'osm:node:harsil_valley',
          name: 'Harsil',
          displayName: 'Harsil, Uttarkashi, Uttarakhand, India',
          state: 'Uttarakhand',
          district: 'Uttarkashi',
          lat: 31.0374,
          lng: 78.7369,
          source: 'osm',
          category: 'village'
        };
        store.setState({ activePlace: harsilPlace });
        root.appendChild(renderPlaceView('osm:node:harsil_valley'));
      } else if (view === 'auth_modal') {
        root.innerHTML = `
          <div style="text-align: center; padding: 40px;">
            <h1>YatraLocal Header & Auth Layer</h1>
            <p style="color: #6B7280;">Supabase Authentication Dialog with Tabbed Login/Signup & Bilingual Error Handling</p>
          </div>
        `;
        showAuthModal({ initialMode: 'signup' });
      } else if (view === 'search_autocomplete') {
        root.innerHTML = `
          <div style="max-width: 680px; margin: 40px auto; position: relative;">
            <div style="text-align: center; margin-bottom: 24px;">
              <span class="badge badge-local">✨ Tourism for Everyone, Powered by Locals</span>
              <h1 style="color: #0D5C5B; font-size: 2.2rem; margin: 8px 0;">Explore India’s Hidden Charms Without the Crowds</h1>
              <p style="color: #6B7280;">Search ANY town, village, temple, or hill station across India</p>
            </div>

            <!-- Autocomplete preview -->
            <div style="position: relative;">
              <div style="display: flex; background: #FFFFFF; border: 2.5px solid #0D5C5B; border-radius: 9999px; box-shadow: 0 4px 16px rgba(13, 92, 91, 0.15); padding: 6px; align-items: center;">
                <span style="font-size: 1.3rem; margin-left: 14px; margin-right: 8px;">🔍</span>
                <input type="text" value="Harsil" style="flex: 1; border: none; outline: none; font-size: 1.05rem; padding: 8px 4px; font-family: inherit; font-weight: 500;">
                <button type="button" class="btn btn-primary" style="border-radius: 9999px; padding: 10px 24px; font-weight: bold;">Explore</button>
              </div>

              <!-- Open Dropdown -->
              <div style="position: absolute; top: calc(100% + 8px); left: 0; right: 0; background: #FFFFFF; border: 1.5px solid #E5E7EB; border-radius: 12px; box-shadow: 0 14px 28px rgba(0,0,0,0.14); overflow: hidden; z-index: 100;">
                <div style="padding: 12px 18px; border-bottom: 1px solid #F3F4F6; display: flex; justify-content: space-between; align-items: center; background: #F0FDF4;">
                  <div>
                    <strong style="color: #0D5C5B; font-size: 1.05rem;">📍 Harsil</strong>
                    <div style="font-size: 0.8rem; color: #4B5563;">Harsil, Bhatwari, Uttarkashi, Uttarakhand, India</div>
                  </div>
                  <span class="badge badge-outline" style="font-size: 0.75rem;">village</span>
                </div>
                <div style="padding: 12px 18px; border-bottom: 1px solid #F3F4F6; display: flex; justify-content: space-between; align-items: center;">
                  <div>
                    <strong style="color: #0D5C5B; font-size: 1.05rem;">📍 Harsil Valley Viewpoint</strong>
                    <div style="font-size: 0.8rem; color: #4B5563;">Gangotri Highway, Uttarkashi, Uttarakhand, India</div>
                  </div>
                  <span class="badge badge-outline" style="font-size: 0.75rem;">viewpoint</span>
                </div>
                <div style="padding: 12px 18px; display: flex; justify-content: space-between; align-items: center;">
                  <div>
                    <strong style="color: #0D5C5B; font-size: 1.05rem;">📍 Harsil Apple Belt</strong>
                    <div style="font-size: 0.8rem; color: #4B5563;">Dharali - Harsil Trail, Uttarakhand, India</div>
                  </div>
                  <span class="badge badge-outline" style="font-size: 0.75rem;">orchard</span>
                </div>
                <div style="background: #F9FAFB; padding: 8px 18px; font-size: 0.75rem; color: #6B7280; border-top: 1px solid #E5E7EB;">
                  Map & places: OpenStreetMap contributors via Photon API
                </div>
              </div>
            </div>
          </div>
        `;
      }
    }

    init();
  </script>
</body>
</html>
