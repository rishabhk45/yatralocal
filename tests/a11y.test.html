<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>YatraLocal - Accessibility (A11y), Polish & QA Test Suite</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 24px; background: #fafafa; }
    .pass { color: green; font-weight: bold; }
    .fail { color: red; font-weight: bold; }
    .test-box { background: white; border: 1px solid #ccc; padding: 16px; margin-bottom: 12px; border-radius: 8px; }
  </style>
</head>
<body>
  <h1>Accessibility & QA Test Suite (Phase 9)</h1>
  <div id="results"></div>

  <div id="test-sandbox" style="display: none;"></div>

  <script type="module">
    import { store } from '../js/store.js';
    import { router } from '../js/router.js';
    import { i18n } from '../js/i18n.js';
    import { renderLandingView } from '../pages/landing.js';
    import { renderNotFoundView } from '../pages/not-found.js';

    const results = document.getElementById('results');
    const log = (name, passed, detail = '') => {
      const div = document.createElement('div');
      div.className = 'test-box';
      div.innerHTML = `
        <span class="${passed ? 'pass' : 'fail'}">${passed ? '✓ PASS' : '✗ FAIL'}</span>: 
        <strong>${name}</strong>
        ${detail ? `<pre style="margin-top:6px; color:#444;">${detail}</pre>` : ''}
      `;
      results.appendChild(div);
      console.log(`[${passed ? 'PASS' : 'FAIL'}] ${name}`, detail);
    };

    async function runA11yTests() {
      // Test 1: Skip to main content link exists in index.html and targets #main-content
      try {
        const res = await fetch('../index.html');
        const html = await res.text();
        const parser = new DOMParser();
        const doc = parser.parseFromString(html, 'text/html');
        const skipLink = doc.querySelector('a.skip-link');
        const hasHref = skipLink && skipLink.getAttribute('href') === '#main-content';
        log('Test 1: Skip link exists in index.html and targets #main-content landmark', Boolean(hasHref), `Found: ${Boolean(skipLink)}, Href: ${skipLink?.getAttribute('href')}`);
      } catch (err) {
        log('Test 1: Skip Link', false, err.message);
      }

      // Test 2: Custom 404 Route renders gracefully on unknown paths
      try {
        const notFoundEl = renderNotFoundView();
        const heading = notFoundEl.querySelector('h1');
        const has404 = heading && heading.textContent.includes('Not Found');
        const hasHomeBtn = notFoundEl.querySelector('a[href="#/"]');

        log('Test 2: Custom 404 Route provides recovery navigation for broken trails', Boolean(has404 && hasHomeBtn), `Heading: "${heading?.textContent.trim()}"`);
      } catch (err) {
        log('Test 2: Custom 404', false, err.message);
      }

      // Test 3: Bilingual i18n dictionary loads and translates navigation keys
      try {
        await i18n.init();
        const enHome = i18n.t('nav.home');
        store.setLanguage('HI');
        const hiHome = i18n.t('nav.home');
        store.setLanguage('EN'); // Restore

        const passed = enHome === 'Home' && hiHome === 'होम';
        log('Test 3: Bilingual dictionary (EN/HI) translates navigation keys', passed, `EN: "${enHome}", HI: "${hiHome}"`);
      } catch (err) {
        log('Test 3: Bilingual i18n', false, err.message);
      }

      // Test 4: Focus management sets tabindex and focuses primary H1 on view mount
      try {
        const sandbox = document.getElementById('test-sandbox');
        sandbox.style.display = 'block';
        sandbox.innerHTML = '';
        const landing = renderLandingView();
        sandbox.appendChild(landing);

        const h1 = landing.querySelector('h1');
        h1.setAttribute('tabindex', '-1');
        h1.focus();

        const isFocused = document.activeElement === h1;
        sandbox.style.display = 'none';

        log('Test 4: Route transition shifts focus to primary H1 heading for screen readers', isFocused, `ActiveElement: ${document.activeElement?.tagName} - "${h1?.textContent.slice(0, 30)}..."`);
      } catch (err) {
        log('Test 4: Focus Management', false, err.message);
      }

      // Test 5: Accessible tap target minimum size (>= 44px) on primary buttons
      try {
        const testBtn = document.createElement('button');
        testBtn.className = 'btn btn-primary';
        testBtn.textContent = 'Tap Target Test';
        document.body.appendChild(testBtn);

        const height = testBtn.offsetHeight;
        testBtn.remove();

        const passed = height >= 44;
        log('Test 5: Interactive buttons enforce minimum 44px tap target height', passed, `Rendered height: ${height}px (Requirement: >= 44px)`);
      } catch (err) {
        log('Test 5: Tap targets', false, err.message);
      }
    }

    runA11yTests();
  </script>
</body>
</html>
